<!DOCTYPE html>

    <style id="theme-vars">
/* BOCCHI THE ROCK! 孤独摇滚原画主题快闪 — 品牌设计系统 */

:root {
  /* 品牌主色：孤独摇滚粉 */
  --bocchi-primary: #F06292;
  --bocchi-primary-600: #EC407A;
  --bocchi-primary-400: #F48FB1;
  --bocchi-primary-300: #F8BBD0;
  --bocchi-primary-200: #FCE4EC;
  --bocchi-primary-100: #FDF2F6;
  --bocchi-primary-foreground: #FFFFFF;

  /* 中性色 */
  --bocchi-background: #FFF5F7;
  --bocchi-foreground: #1F1F1F;
  --bocchi-card: #FFFFFF;
  --bocchi-card-foreground: #1F1F1F;
  --bocchi-popover: #FFFFFF;
  --bocchi-popover-foreground: #1F1F1F;
  --bocchi-muted: #FCE4EC;
  --bocchi-muted-foreground: #6B7280;
  --bocchi-border: #F8BBD0;
  --bocchi-input: #FFFFFF;
  --bocchi-ring: #F06292;

  /* 语义状态色 */
  --bocchi-destructive: #EF4444;
  --bocchi-destructive-foreground: #FFFFFF;

  /* 摇滚点缀色 */
  --bocchi-ink: #1F1F1F;
  --bocchi-ink-2: #4B5563;
  --bocchi-ink-3: #9CA3AF;
  --bocchi-surface: #FFFFFF;
  --bocchi-surface-2: #FCE4EC;
  --bocchi-line: #F8BBD0;

  /* 形状系统 */
  --bocchi-radius-small: 4px;
  --bocchi-radius-medium: 8px;
  --bocchi-radius-large: 16px;
  --bocchi-radius-full: 9999px;

  /* 字体系统 */
  --bocchi-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --bocchi-font-display: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  /* 阴影 */
  --bocchi-shadow-1: 0 1px 2px rgba(31, 31, 31, 0.04), 0 1px 1px rgba(31, 31, 31, 0.02);
  --bocchi-shadow-2: 0 8px 24px -8px rgba(240, 98, 146, 0.05);
  --bocchi-shadow-3: 0 24px 60px -20px rgba(240, 98, 146, 0.05);
}

/* 暗色模式占位（本项目以亮色为主） */
.dark {
  --bocchi-background: #1A1215;
  --bocchi-foreground: #FAFAFA;
  --bocchi-card: #2A1E22;
  --bocchi-card-foreground: #FAFAFA;
  --bocchi-muted: #3A2A30;
  --bocchi-muted-foreground: #A1A1AA;
  --bocchi-border: #4A343C;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {

    --color-card-foreground: var(--bocchi-card-foreground);
    --color-popover: var(--bocchi-popover);
    --color-popover-foreground: var(--bocchi-popover-foreground);
    --color-primary: var(--bocchi-primary);
    --color-primary-foreground: var(--bocchi-primary-foreground);
    --color-muted: var(--bocchi-muted);
    --color-muted-foreground: var(--bocchi-muted-foreground);
    --color-destructive: var(--bocchi-destructive);
    --color-destructive-foreground: var(--bocchi-destructive-foreground);
    --color-border: var(--bocchi-border);
    --color-input: var(--bocchi-input);
    --color-ring: var(--bocchi-ring);
    --radius-sm: var(--bocchi-radius-small);
    --radius-md: var(--bocchi-radius-medium);
    --radius-lg: var(--bocchi-radius-large);

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

<body class="light">
  <div class="page-wrap">
    <header class="hero" id="hero">
      <div class="hero-kicker"><i data-lucide="sparkles" style="width:14px;height:14px;"></i> 信息公开</div>
      <h1 class="hero-title">BOCCHI<br>THE <span>ROCK!</span></h1>
      <p class="hero-subtitle">孤独摇滚原画主题快闪</p>
    </header>

    <section class="section">
      <div class="card" id="event-title"><h2 class="section-title"><span class="dot"></span>活动定档</h2><p id="copy-event-title" style="margin:0 0 12px;font-size:15px;color:var(--bocchi-ink-2);">BOCCHI THE ROCK！孤独摇滚原画主题快闪正式定档</p><div id="copy-event-date" style="font-size:28px;font-weight:900;color:var(--bocchi-primary-600);text-align:center;margin:8px 0;">2026年9月4日</div></div>

      <div class="card">
        <h2 class="section-title"><span class="dot"></span>预约信息</h2>

        <div class="info-row" id="booking-hours"><i data-lucide="calendar-check" class="info-icon"></i>

    <style id="critical-layout">
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--bocchi-font-sans);
      background: var(--bocchi-background);
      color: var(--bocchi-foreground);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; height: auto; display: block; }
    .page-wrap {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 32px;
    }
    .hero {
      background: linear-gradient(180deg, var(--bocchi-primary-200) 0%, var(--bocchi-background) 100%);
      padding: 40px 20px 32px;
      text-align: center;
      border-bottom: 3px solid var(--bocchi-primary);
    }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bocchi-primary);
      color: var(--bocchi-primary-foreground);
      padding: 6px 14px;
      border-radius: var(--bocchi-radius-full);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .hero-title {
      font-family: var(--bocchi-font-display);
      font-size: clamp(32px, 9vw, 48px);
      font-weight: 900;
      line-height: 1.05;
      color: var(--bocchi-ink);
      margin: 0 0 12px;
      text-wrap: balance;
    }
    .hero-title span {
      color: var(--bocchi-primary-600);
    }
    .hero-subtitle {
      font-size: 18px;
      font-weight: 700;
      color: var(--bocchi-ink-2);
      margin: 0;
    }
    .section {
      padding: 24px 16px 0;
    }
    .card {
      background: var(--bocchi-card);
      border-radius: var(--bocchi-radius-large);
      padding: 20px;
      border: 1px solid var(--bocchi-border);
      box-shadow: var(--bocchi-shadow-1);
    }
    .card + .card {
      margin-top: 16px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      color: var(--bocchi-primary-600);
      margin: 0 0 14px;
    }
    .section-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bocchi-primary);
    }
    .info-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px dashed var(--bocchi-line);
    }
    .info-row:last-child { border-bottom: none; }
    .info-icon {
      width: 22px;
      height: 22px;
      color: var(--bocchi-primary);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .info-label {
      font-size: 13px;
      color: var(--bocchi-ink-3);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .info-value {
      font-size: 15px;
      color: var(--bocchi-ink);
      font-weight: 600;
    }
    .info-value small {
      display: block;
      font-size: 13px;
      color: var(--bocchi-ink-2);
      font-weight: 400;
      margin-top: 2px;
    }
    .highlight-box {
      background: var(--bocchi-primary-100);
      border-left: 4px solid var(--bocchi-primary);
      border-radius: 0 var(--bocchi-radius-medium) var(--bocchi-radius-medium) 0;
      padding: 14px 16px;
      margin-top: 14px;
    }
    .highlight-box p {
      margin: 0;
      font-size: 14px;
      color: var(--bocchi-ink);
    }
    .goods-grid {
      display: grid;
      gap: 12px;
    }
    .goods-item {
      background: var(--bocchi-card);
      border-radius: var(--bocchi-radius-large);
      overflow: hidden;
      border: 1px solid var(--bocchi-border);
      box-shadow: var(--bocchi-shadow-1);
    }
    .goods-item img {
      width: 100%;
    }
    .goods-caption {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--bocchi-ink-2);
      text-align: center;
      background: var(--bocchi-primary-100);
      font-weight: 600;
    }
    .gift-card img {
      width: 100%;
      border-radius: var(--bocchi-radius-large);
      border: 1px solid var(--bocchi-border);
    }
    .location-card {
      text-align: center;
    }
    .location-card .venue {
      font-size: 22px;
      font-weight: 800;
      color: var(--bocchi-primary-600);
      margin: 8px 0 4px;
    }
    .location-card .address {
      font-size: 15px;
      color: var(--bocchi-ink-2);
    }
    .footer-note {
      text-align: center;
      padding: 24px 16px 8px;
      font-size: 12px;
      color: var(--bocchi-ink-3);
    }
  </style>
</body>
